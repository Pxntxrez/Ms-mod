name: Build MonsterSwarm Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: mysrc

      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Forge MDK
        run: |
          curl -L -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2847/forge-1.12.2-14.23.5.2847-mdk.zip"
          unzip -q mdk.zip -d mdk
          chmod +x mdk/gradlew

      - name: Copy sources into MDK
        run: |
          rm -rf mdk/src
          mkdir -p mdk/src/main/java
          cp -r mysrc/src/java/. mdk/src/main/java/
          cp -r mysrc/src/resources mdk/src/main/resources 2>/dev/null || true
          cat > mdk/build.gradle << 'EOF'
          buildscript {
              repositories {
                  jcenter()
                  maven { url = "http://files.minecraftforge.net/maven" }
              }
              dependencies {
                  classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
              }
          }
          apply plugin: 'net.minecraftforge.gradle.forge'
          version = "2.0.2"
          group = "eu.keray.swarm"
          archivesBaseName = "MonsterSwarm"
          minecraft {
              version = "1.12.2-14.23.5.2847"
              runDir = "run"
              mappings = "stable_39"
          }
          processResources {
              inputs.property "version", project.version
              inputs.property "mcversion", project.minecraft.version
              from(sourceSets.main.resources.srcDirs) {
                  include 'mcmod.info'
                  expand 'version': project.version, 'mcversion': project.minecraft.version
              }
              from(sourceSets.main.resources.srcDirs) {
                  exclude 'mcmod.info'
              }
          }
          jar {
              from sourceSets.main.output
              manifest {
                  attributes([
                      "Specification-Title": "monsterswarm",
                      "Specification-Vendor": "keray",
                      "Specification-Version": "1",
                      "Implementation-Title": project.name,
                      "Implementation-Version": "${version}",
                      "Implementation-Vendor": "keray",
                  ])
              }
          }
          EOF

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge-1.12.2-14.23.5.2847
          restore-keys: forge-1.12.2-

      - name: Setup Forge workspace
        working-directory: mdk
        run: ./gradlew setupDecompWorkspace --no-daemon
        timeout-minutes: 30

      - name: Build mod
        working-directory: mdk
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MonsterSwarm-2.0.2
          path: mdk/build/libs/MonsterSwarm-2.0.2.jar
