name: Build MonsterSwarm Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle
      - run: chmod +x gradlew
      - run: ./gradlew setupDecompWorkspace --no-daemon
        timeout-minutes: 30
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v3
        with:
          name: MonsterSwarm-2.0.2
          path: build/libs/MonsterSwarm-*.jar
